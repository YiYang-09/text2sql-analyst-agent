  split: test
  difficulty: hard
  skills: [window]
  question: In which year did EU27 new battery-electric registrations grow the most in absolute terms compared with the previous year?
  sql: |
    select year from (
      select year, new_electric - lag(new_electric) over (order by year) as diff
      from metrics_eu27_year
    ) where diff is not null
    order by diff desc limit 1

