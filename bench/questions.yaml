# Benchmark questions for the EU lorry database.
#
# split:      dev  = few-shot example pool (never scored)
#             test = scored questions
# difficulty: easy | medium | hard
# skills:     lookup, filter, aggregation, ranking, join, window, multi_step, fuel_hierarchy,
#             trap_aggregate (EU27 aggregate row), trap_null (missing is not zero / partial year),
#             unanswerable (the honest answer is NULL / not available)
# sql:        gold SQL. Its result is the gold answer (see evaluation/compare.py for the matching rules).
# order_matters: true only when the question asks for an ordered list.

# ----------------------------------------------------------------------------------------------
# dev (few-shot pool)
# ----------------------------------------------------------------------------------------------
- id: d01
  split: dev
  difficulty: easy
  skills: [lookup]
  question: How many new battery-electric lorries were registered in Germany in 2023?
  sql: select new_electric from metrics_country_year where geo = 'DE' and year = 2023

- id: d02
  split: dev
  difficulty: easy
  skills: [filter]
  question: Which countries in the data are Nordic countries?
  sql: select geo from dim_country where is_nordic

- id: d03
  split: dev
  difficulty: medium
  skills: [filter]
  question: What was the EU27 electric share of new lorries in each year from 2019 to 2024?
  sql: select year, new_electric_share from metrics_eu27_year where year between 2019 and 2024 order by year

- id: d04
  split: dev
  difficulty: medium
  skills: [ranking, join, trap_aggregate]
  question: Which 3 EU27 member states had the most battery-electric lorries in use in 2023, and how many?
  sql: |
    select m.geo, m.stock_electric
    from metrics_country_year m join dim_country c using (geo)
    where c.is_eu27 and m.year = 2023 and m.stock_electric is not null
    order by m.stock_electric desc limit 3

- id: d05
  split: dev
  difficulty: medium
  skills: [fuel_hierarchy]
  question: How many new diesel lorries, excluding hybrids, were registered in France in 2022?
  sql: select units from fct_new_lorries_bi where geo = 'FR' and year = 2022 and mot_nrg = 'DIE_X_HYB'

- id: d06
  split: dev
  difficulty: medium
  skills: [join]
  question: For each Nordic country, what was the electric share of new lorries in 2024?
  sql: |
    select m.geo, m.new_electric_share
    from metrics_country_year m join dim_country c using (geo)
    where c.is_nordic and m.year = 2024

- id: d07
  split: dev
  difficulty: medium
  skills: [aggregation]
  question: In which year did Sweden first register at least 100 new battery-electric lorries?
  sql: select min(year) from metrics_country_year where geo = 'SE' and new_electric >= 100

- id: d08
  split: dev
  difficulty: hard
  skills: [window, join]
  question: Which EU27 member state had the largest increase in new battery-electric lorries from 2023 to 2024, in units?
  sql: |
    select a.geo
    from metrics_country_year a
    join metrics_country_year b on b.geo = a.geo and b.year = 2023
    join dim_country c on c.geo = a.geo
    where a.year = 2024 and c.is_eu27
    order by a.new_electric - b.new_electric desc nulls last
    limit 1

- id: d09
  split: dev
  difficulty: easy
  skills: [lookup]
  question: What does the Eurostat flag 'p' mean?
  sql: select meaning from dim_flag where flag = 'p'

- id: d10
  split: dev
  difficulty: hard
  skills: [aggregation, trap_aggregate, trap_null]
  question: How many new lorries were registered in total across all individual countries in the data in 2023?
  sql: |
    select sum(new_total)
    from metrics_country_year m join dim_country c using (geo)
    where m.year = 2023 and not c.is_aggregate

